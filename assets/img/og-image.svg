<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="huisjurist — Uw huisjurist voor uw zakelijke en persoonlijke vragen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00233a"/>
      <stop offset="0.55" stop-color="#005B8C"/>
      <stop offset="1" stop-color="#1E86B8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd791"/>
      <stop offset="1" stop-color="#c98523"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1060" cy="520" r="220" fill="#E9A23B" opacity="0.16"/>
  <circle cx="140" cy="90" r="160" fill="#7ec0e2" opacity="0.18"/>

  <!-- brand mark -->
  <rect x="80" y="72" width="72" height="72" rx="20" fill="url(#gold)"/>
  <text x="116" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle">H</text>
  <text x="172" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#ffffff">huisjurist</text>
  <text x="174" y="140" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="6" fill="#ffffff" opacity="0.8">LEGALLY BLONDE SINDS 1996</text>

  <!-- headline -->
  <text x="80" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#ffffff">Uw huisjurist voor uw</text>
  <text x="80" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="url(#gold)">zakelijke</text>
  <text x="410" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#ffffff">en persoonlijke</text>
  <text x="80" y="456" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#ffffff">vragen.</text>

  <!-- badges -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff">
    <rect x="80" y="510" width="250" height="54" rx="27" fill="#ffffff" opacity="0.14"/>
    <text x="205" y="544" text-anchor="middle" font-weight="700">Juridisch advies</text>
    <rect x="352" y="510" width="200" height="54" rx="27" fill="#ffffff" opacity="0.14"/>
    <text x="452" y="544" text-anchor="middle" font-weight="700">Mediation</text>
    <rect x="574" y="510" width="270" height="54" rx="27" fill="#ffffff" opacity="0.14"/>
    <text x="709" y="544" text-anchor="middle" font-weight="700">Interim-management</text>
  </g>

  <!-- url pill -->
  <rect x="905" y="510" width="215" height="54" rx="27" fill="url(#gold)"/>
  <text x="1012" y="545" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#00233a" text-anchor="middle">huisjurist.nl</text>
</svg>
